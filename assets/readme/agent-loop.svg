<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">MemKraft accountable agent memory loop</title>
  <desc id="desc">An agent remembers sourced knowledge, retrieves a budgeted context, acts, reports the outcome, and improves future context ordering while local Markdown and audit records remain inspectable.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#35c6b4"/>
    </marker>
  </defs>
  <rect width="1200" height="390" rx="24" fill="#0d1117"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="58" y="54" fill="#8b949e" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" letter-spacing="2">THE ACCOUNTABLE LOOP</text>
    <text x="58" y="94" fill="#f0f6fc" font-size="30" font-weight="700">Useful memory is evidence that changes the next action.</text>

    <g transform="translate(58 142)">
      <g>
        <rect width="190" height="116" rx="14" fill="#161b22" stroke="#30363d"/>
        <text x="20" y="34" fill="#35c6b4" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18">01  REMEMBER</text>
        <text x="20" y="67" fill="#f0f6fc" font-size="22" font-weight="650">Sourced facts</text>
        <text x="20" y="94" fill="#8b949e" font-size="18">Markdown + timeline</text>
      </g>
      <path d="M198 58H232" stroke="#35c6b4" stroke-width="2" marker-end="url(#arrow)"/>
      <g transform="translate(240)">
        <rect width="190" height="116" rx="14" fill="#161b22" stroke="#30363d"/>
        <text x="20" y="34" fill="#35c6b4" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18">02  RETRIEVE</text>
        <text x="20" y="67" fill="#f0f6fc" font-size="22" font-weight="650">Budgeted context</text>
        <text x="20" y="94" fill="#8b949e" font-size="18">Provenance retained</text>
      </g>
      <path d="M438 58H472" stroke="#35c6b4" stroke-width="2" marker-end="url(#arrow)"/>
      <g transform="translate(480)">
        <rect width="150" height="116" rx="14" fill="#161b22" stroke="#30363d"/>
        <text x="20" y="34" fill="#35c6b4" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18">03  ACT</text>
        <text x="20" y="67" fill="#f0f6fc" font-size="22" font-weight="650">Use context</text>
        <text x="20" y="94" fill="#8b949e" font-size="18">Your agent runs</text>
      </g>
      <path d="M638 58H672" stroke="#35c6b4" stroke-width="2" marker-end="url(#arrow)"/>
      <g transform="translate(680)">
        <rect width="190" height="116" rx="14" fill="#161b22" stroke="#30363d"/>
        <text x="20" y="34" fill="#35c6b4" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18">04  REPORT</text>
        <text x="20" y="67" fill="#f0f6fc" font-size="22" font-weight="650">Outcome + reward</text>
        <text x="20" y="94" fill="#8b949e" font-size="18">Append-only record</text>
      </g>
      <path d="M878 58H912" stroke="#35c6b4" stroke-width="2" marker-end="url(#arrow)"/>
      <g transform="translate(920)">
        <rect width="164" height="116" rx="14" fill="#102a27" stroke="#35c6b4"/>
        <text x="20" y="34" fill="#35c6b4" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18">05  IMPROVE</text>
        <text x="20" y="67" fill="#f0f6fc" font-size="22" font-weight="650">Re-rank</text>
        <text x="20" y="94" fill="#a4ddd6" font-size="18">Next retrieval</text>
      </g>
    </g>

    <path d="M1060 277C1060 340 155 340 155 277" fill="none" stroke="#35c6b4" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#arrow)"/>
    <text x="600" y="363" text-anchor="middle" fill="#8b949e" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18">inspectable local state · deterministic replay · explicit governance</text>
  </g>
</svg>

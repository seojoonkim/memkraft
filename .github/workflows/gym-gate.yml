name: Memory Gym Gate

on:
  pull_request:
  push:
    branches: [main]

env:
  # Check out and audit the PR head itself, never GitHub's synthetic merge commit.
  # A real merge commit is audited only when it is itself the push candidate.
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  packaging:
    name: wheel metadata smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit single release lineage
        run: python scripts/audit_release_lineage.py --repo . --manifest release_manifest.json --candidate-sha "$CANDIDATE_SHA"
      - name: Audit version source and release tag integrity
        run: python scripts/check_version_integrity.py --repo .
      - name: Build distributions
        run: |
          python -m pip install build
          python -m build
      - name: Verify metadata from a fresh wheel install
        run: |
          python -m venv /tmp/memkraft-wheel-smoke
          /tmp/memkraft-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/memkraft-wheel-smoke/bin/python - <<'PY'
          from importlib.metadata import version
          import tomllib

          import memkraft

          project_version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          assert version("memkraft") == memkraft.__version__ == project_version
          PY

  search-recall:
    name: search_recall / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install -e .
          python -m pip install pytest tomli

      - name: Run test suite
        run: python -m pytest tests/ -q

      - name: Run Memory Gym search_recall gate
        run: |
          python benchmarks/gym/run.py \
            --scenario search_recall \
            --gate \
            --out /tmp/memkraft-search-recall-gate.json

      - name: Run Memory Gym session_overlay_recall gate
        run: |
          python benchmarks/gym/run.py \
            --scenario session_overlay_recall \
            --sizes 20 \
            --top-k 5 \
            --gate \
            --out /tmp/memkraft-session-overlay-gate.json

      - name: Run Memory Gym resolver_verdicts gate
        run: |
          python benchmarks/gym/run.py \
            --scenario resolver_verdicts \
            --sizes 120 \
            --gate \
            --out /tmp/memkraft-resolver-verdicts-gate.json

      - name: Run Memory Gym last_interaction gate
        run: |
          python benchmarks/gym/run.py \
            --scenario last_interaction \
            --sizes 10000 \
            --gate \
            --out /tmp/memkraft-last-interaction-gate.json

      - name: Run Memory Gym lifecycle/governance scenario
        run: |
          python benchmarks/gym/run.py \
            --scenario lifecycle_governance \
            --sizes 1 \
            --gate \
            --out /tmp/memkraft-lifecycle-governance-gate.json

      - name: Run Memory Gym outcome/context gate
        run: |
          python benchmarks/gym/run.py \
            --scenario outcome_context \
            --sizes 1 \
            --gate \
            --out /tmp/memkraft-outcome-context-gate.json

      - name: Run deterministic v3 lifecycle replay gate
        run: |
          python benchmarks/gym/run.py \
            --scenario lifecycle_replay \
            --sizes 1 \
            --gate \
            --out /tmp/memkraft-lifecycle-replay-gate.json

      - name: Run Memory Gym search_precision gate
        run: |
          python benchmarks/gym/run.py \
            --scenario search_precision \
            --sizes 20 \
            --top-k 40 \
            --gate \
            --out /tmp/memkraft-search-precision-gate.json

      - name: Run Memory Gym search_recall_ko gate
        run: |
          python benchmarks/gym/run.py \
            --scenario search_recall_ko \
            --sizes 20 \
            --top-k 5 \
            --gate \
            --out /tmp/memkraft-search-recall-ko-gate.json

      - name: Run Memory Gym claim_extraction gate
        run: |
          python benchmarks/gym/run.py \
            --scenario claim_extraction \
            --sizes 1 \
            --gate \
            --out /tmp/memkraft-claim-extraction-gate.json

      - name: Run Memory Gym truth_freshness gate
        run: |
          python benchmarks/gym/run.py \
            --scenario truth_freshness \
            --sizes 1 \
            --gate \
            --out /tmp/memkraft-truth-freshness-gate.json

  optional-dependencies:
    name: optional / ${{ matrix.extra }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - extra: watch
            tests: tests/test_v081_watch.py
          - extra: schedule
            tests: tests/test_v110_lifecycle.py
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install optional dependency and tests
        run: python -m pip install ".[${{ matrix.extra }}]" pytest
      - name: Run optional dependency tests
        run: python -m pytest ${{ matrix.tests }} -q

  # The embedding extra downloads a live model, so it intentionally remains
  # outside default CI. Exercise it only from an explicit/periodic workflow.

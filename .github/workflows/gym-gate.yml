name: Memory Gym Gate

on:
  pull_request:
    paths:
      - "src/**"
      - "benchmarks/**"
      - "tests/**"
      - "pyproject.toml"
      - "setup.py"
      - ".github/workflows/gym-gate.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "benchmarks/**"
      - "tests/**"
      - "pyproject.toml"
      - "setup.py"
      - ".github/workflows/gym-gate.yml"

jobs:
  packaging:
    name: wheel metadata smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build distributions
        run: |
          python -m pip install build
          python -m build
      - name: Verify metadata from a fresh wheel install
        run: |
          python -m venv /tmp/memkraft-wheel-smoke
          /tmp/memkraft-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/memkraft-wheel-smoke/bin/python - <<'PY'
          from importlib.metadata import version
          import memkraft

          assert version("memkraft") == memkraft.__version__ == "2.13.0"
          PY

  search-recall:
    name: search_recall / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install -e .
          python -m pip install pytest tomli

      - name: Run test suite
        run: python -m pytest tests/ -q

      - name: Run Memory Gym search_recall gate
        run: |
          python benchmarks/gym/run.py \
            --scenario search_recall \
            --gate \
            --out /tmp/memkraft-search-recall-gate.json

      - name: Run Memory Gym session_overlay_recall scenario
        run: |
          python benchmarks/gym/run.py \
            --scenario session_overlay_recall \
            --sizes 20 \
            --top-k 5 \
            --out /tmp/memkraft-session-overlay-gate.json

      - name: Run Memory Gym resolver_verdicts scenario
        run: |
          python benchmarks/gym/run.py \
            --scenario resolver_verdicts \
            --sizes 120 \
            --out /tmp/memkraft-resolver-verdicts-gate.json

      - name: Run Memory Gym last_interaction scenario
        run: |
          python benchmarks/gym/run.py \
            --scenario last_interaction \
            --sizes 10000 \
            --out /tmp/memkraft-last-interaction-gate.json

  optional-dependencies:
    name: optional / ${{ matrix.extra }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - extra: watch
            tests: tests/test_v081_watch.py
          - extra: schedule
            tests: tests/test_v110_lifecycle.py
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install optional dependency and tests
        run: python -m pip install ".[${{ matrix.extra }}]" pytest
      - name: Run optional dependency tests
        run: python -m pytest ${{ matrix.tests }} -q

  # The embedding extra downloads a live model, so it intentionally remains
  # outside default CI. Exercise it only from an explicit/periodic workflow.
